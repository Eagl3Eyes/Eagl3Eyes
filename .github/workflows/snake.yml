# in your profile repository (Eagl3Eyes/Eagl3Eyes)
#
# Required once (repo Settings → Actions → General → Workflow permissions):
#   select "Read and write permissions" so the workflow can push the
#   generated SVGs to the `output` branch.

name: Generate snake animation

on:
  push:
    branches: [main, master]
  schedule:
    # once a day at 03:20 UTC
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-light.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
