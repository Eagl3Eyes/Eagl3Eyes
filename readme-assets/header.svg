<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img" aria-labelledby="hdrTitle hdrDesc">
  <title id="hdrTitle">Tuhin Al Jobayer — Full Stack Developer</title>
  <desc id="hdrDesc">Animated hero card: glowing gradient name, light sweep, marching neon border, floating particles and twinkling sparkles</desc>

  <defs>
    <!-- Main animated gradient: blue -> purple -> pink -> teal -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color"
                 values="#58a6ff;#bf91f3;#ff7eb6;#2dd4bf;#58a6ff"
                 dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bf91f3">
        <animate attributeName="stop-color"
                 values="#bf91f3;#ff7eb6;#2dd4bf;#58a6ff;#bf91f3"
                 dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff7eb6">
        <animate attributeName="stop-color"
                 values="#ff7eb6;#2dd4bf;#58a6ff;#bf91f3;#ff7eb6"
                 dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card background gradient (works on both light & dark GitHub mode) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1c2230" />
    </linearGradient>

    <!-- Sweeping highlight band across the letters -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0" dur="3s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Neon glow behind the name -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <!-- Twinkling 4-point sparkle -->
    <path id="star"
          d="M0,-17 C2,-7 7,-2 17,0 C7,2 2,7 0,17 C-2,7 -7,2 -17,0 C-7,-2 -2,-7 0,-17 Z" />
  </defs>

  <!-- ============ 1) hero card ============ -->
  <rect x="6" y="6" width="908" height="198" rx="18"
        fill="url(#bg)" fill-opacity="0.96" />

  <!-- ============ 2) floating particles ============ -->
  <circle cx="84" r="3" fill="#58a6ff">
    <animate attributeName="cy" values="206;8" dur="7s" begin="0s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="7s" begin="0s" repeatCount="indefinite" />
  </circle>
  <circle cx="212" r="2.5" fill="#bf91f3">
    <animate attributeName="cy" values="206;8" dur="9s" begin="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.15;0.8;1" dur="9s" begin="1.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="336" r="3" fill="#ff7eb6">
    <animate attributeName="cy" values="206;8" dur="8s" begin="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="8s" begin="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="596" r="2.5" fill="#2dd4bf">
    <animate attributeName="cy" values="206;8" dur="7.5s" begin="0.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.15;0.8;1" dur="7.5s" begin="0.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="724" r="3" fill="#58a6ff">
    <animate attributeName="cy" values="206;8" dur="9.5s" begin="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="9.5s" begin="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="852" r="3.5" fill="#bf91f3">
    <animate attributeName="cy" values="206;8" dur="8.5s" begin="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.15;0.8;1" dur="8.5s" begin="1.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="470" r="2" fill="#ffffff">
    <animate attributeName="cy" values="206;8" dur="11s" begin="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.15;0.8;1" dur="11s" begin="4s" repeatCount="indefinite" />
  </circle>

  <!-- ============ 3) marching neon border ============ -->
  <rect x="6.5" y="6.5" width="907" height="197" rx="18"
        fill="none" stroke="#30363d" stroke-width="1" />
  <rect x="6.5" y="6.5" width="907" height="197" rx="18"
        fill="none" stroke="url(#grad)" stroke-width="2.5"
        stroke-dasharray="70 340" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-820" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- ============ 4) the name (glow + gradient + sweep), gently bobbing ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -4; 0 0" dur="3.5s" repeatCount="indefinite" />

    <!-- glow layer -->
    <text x="460" y="110" text-anchor="middle"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="74" font-weight="800"
          fill="url(#grad)" filter="url(#glow)" opacity="0.5">Tuhin Al Jobayer</text>

    <!-- main gradient name -->
    <text x="460" y="110" text-anchor="middle"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="74" font-weight="800"
          fill="url(#grad)">Tuhin Al Jobayer</text>

    <!-- light sweep -->
    <text x="460" y="110" text-anchor="middle"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="74" font-weight="800"
          fill="url(#shine)">Tuhin Al Jobayer</text>
  </g>

  <!-- ============ 5) twinkling sparkles ============ -->
  <g transform="translate(128,62)">
    <use href="#star" fill="url(#grad)">
      <animateTransform attributeName="transform" type="scale"
                        values="0.7;1.15;0.7" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;1;0.35"
               dur="2.4s" repeatCount="indefinite" />
    </use>
  </g>
  <g transform="translate(792,62)">
    <use href="#star" fill="url(#grad)">
      <animateTransform attributeName="transform" type="scale"
                        values="1.1;0.65;1.1" dur="2.9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.3;1"
               dur="2.9s" repeatCount="indefinite" />
    </use>
  </g>
  <g transform="translate(104,134)">
    <use href="#star" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
                        values="0.35;0.6;0.35" dur="3.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.9;0.25"
               dur="3.3s" repeatCount="indefinite" />
    </use>
  </g>
  <g transform="translate(816,134)">
    <use href="#star" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
                        values="0.6;0.3;0.6" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.25;0.9"
               dur="2.1s" repeatCount="indefinite" />
    </use>
  </g>

  <!-- ============ 6) subtitle ============ -->
  <text x="460" y="160" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="24" font-weight="500"
        letter-spacing="7" fill="#8b949e">FULL STACK DEVELOPER</text>

  <!-- ============ 7) pulsing accent underline ============ -->
  <rect x="350" y="180" width="220" height="4" rx="2" fill="url(#grad)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
