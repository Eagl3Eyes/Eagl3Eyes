<svg xmlns="http://www.w3.org/2000/svg" width="920" height="90" viewBox="0 0 920 90" role="img" aria-labelledby="gsTitle gsDesc">
  <title id="gsTitle">GitHub Stats</title>
  <desc id="gsDesc">Animated neon banner introducing the GitHub statistics section</desc>

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bf91f3;#ff7eb6;#2dd4bf;#58a6ff" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bf91f3">
        <animate attributeName="stop-color" values="#bf91f3;#ff7eb6;#2dd4bf;#58a6ff;#bf91f3" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff7eb6">
        <animate attributeName="stop-color" values="#ff7eb6;#2dd4bf;#58a6ff;#bf91f3;#ff7eb6" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1c2230" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="3s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <path id="star" d="M0,-17 C2,-7 7,-2 17,0 C7,2 2,7 0,17 C-2,7 -7,2 -17,0 C-7,-2 -2,-7 0,-17 Z" />
  </defs>

  <rect x="6" y="6" width="908" height="78" rx="18" fill="url(#bg)" fill-opacity="0.96" />

  <!-- floating particles -->
  <circle cx="150" r="2.5" fill="#58a6ff">
    <animate attributeName="cy" values="72;12" dur="9s" begin="0s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.8;1" dur="9s" begin="0s" repeatCount="indefinite" />
  </circle>
  <circle cx="330" r="2.5" fill="#bf91f3">
    <animate attributeName="cy" values="72;12" dur="11s" begin="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.8;1" dur="11s" begin="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="560" r="2.5" fill="#2dd4bf">
    <animate attributeName="cy" values="72;12" dur="8s" begin="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.8;1" dur="8s" begin="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" r="2.5" fill="#ff7eb6">
    <animate attributeName="cy" values="72;12" dur="10s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.8;1" dur="10s" begin="1s" repeatCount="indefinite" />
  </circle>

  <!-- marching neon border -->
  <rect x="6.5" y="6.5" width="907" height="77" rx="18" fill="none" stroke="#30363d" stroke-width="1" />
  <rect x="6.5" y="6.5" width="907" height="77" rx="18" fill="none" stroke="url(#grad)" stroke-width="2.5"
        stroke-dasharray="100 350" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-900" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- title (glow + gradient + sweep), bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="4s" repeatCount="indefinite" />
    <text x="460" y="54" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="800"
          letter-spacing="8" fill="url(#grad)" filter="url(#glow)" opacity="0.5">GITHUB STATS</text>
    <text x="460" y="54" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="800"
          letter-spacing="8" fill="url(#grad)">GITHUB STATS</text>
    <text x="460" y="54" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="800"
          letter-spacing="8" fill="url(#shine)">GITHUB STATS</text>
  </g>

  <!-- pulsing accent underline -->
  <rect x="400" y="66" width="120" height="3" rx="1.5" fill="url(#grad)">
    <animate attributeName="opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- flanking sparkles -->
  <g transform="translate(280,30)">
    <use href="#star" fill="url(#grad)" transform="scale(0.4)">
      <animateTransform attributeName="transform" type="scale" values="0.28;0.55;0.28" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite" />
    </use>
  </g>
  <g transform="translate(640,30)">
    <use href="#star" fill="url(#grad)" transform="scale(0.4)">
      <animateTransform attributeName="transform" type="scale" values="0.55;0.28;0.55" dur="3.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite" />
    </use>
  </g>
</svg>
